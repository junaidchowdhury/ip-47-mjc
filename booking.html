                        <input id="check-in" class="date" type="date" name="checkin" value="<?php echo $user['age'] ?? ''; ?>" required>
                        <label>Check In</label>
                    </div>
                    <div class="input-box">
                        <input id="check-out" class="date" type="date" name="chechout" value="<?php echo $user['favorite_place'] ?? ''; ?>" required>

                    </div>
                    <button type="submit" class="btn">Confirm</button>
                </form>

    <div class="booking-modal" id="booking-modal" role="dialog" aria-modal="true" aria-labelledby="booking-title">
        <div class="booking-dialog">
            <button class="close-booking" type="button" aria-label="Close booking popup">&times;</button>
            <h2 id="booking-title">Booking Confirmation</h2>
            <div class="booking-summary">
                <p><strong>Booking number</strong><span id="summary-number"></span></p>
                <p><strong>Name</strong><span id="summary-name"></span></p>
                <p><strong>Hotel</strong><span id="summary-hotel"></span></p>
                <p><strong>Check-in date</strong><span id="summary-check-in"></span></p>
                <p><strong>Check-out date</strong><span id="summary-check-out"></span></p>
                <p><strong>Status</strong><span class="pending-status" id="summary-status">Pending</span></p>
            </div>
            <div class="booking-actions">
                <button class="confirm-booking" type="button">Confirm</button>
                <button class="cancel-booking" type="button">Cancel</button>
            </div>
        </div>
    </div>


<script>
    const bookingForm = document.getElementById('booking-form');
    const bookingModal = document.getElementById('booking-modal');
    const summaryStatus = document.getElementById('summary-status');

    bookingForm.addEventListener('submit', function (submitEvent) {
        submitEvent.preventDefault();

        document.getElementById('summary-number').textContent = `PG-${Date.now().toString().slice(-8)}`;
        document.getElementById('summary-name').textContent = bookingForm.elements.full_name.value;
        document.getElementById('summary-hotel').textContent = document.getElementById('hotel-name').value;
        document.getElementById('summary-check-in').textContent = document.getElementById('check-in').value;
        document.getElementById('summary-check-out').textContent = document.getElementById('check-out').value;
        summaryStatus.textContent = 'Pending';
        summaryStatus.className = 'pending-status';
        bookingModal.classList.add('open');
    });

    function closeBookingPopup() {
        bookingModal.classList.remove('open');
    }

    document.querySelector('.close-booking').addEventListener('click', closeBookingPopup);
    document.querySelector('.cancel-booking').addEventListener('click', closeBookingPopup);

    document.querySelector('.confirm-booking').addEventListener('click', function () {
        summaryStatus.textContent = 'Confirmed';
        summaryStatus.className = 'confirmed-status';
    });

    bookingModal.addEventListener('click', function (clickedElement) {
        if (clickedElement.target === bookingModal) {
            closeBookingPopup();
        }
    });

</script>
