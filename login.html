<!doctype html>
<html lang="en">
  <head>
    <title>PillGrim Login Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;1,500&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "poppins", sans-serif;
      }
      body {
        min-height: 100vh;
        width: 100%;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .background {
        background: url(images/backgroun3.jpg) no-repeat center center/cover;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        filter: blur(5px);
      }
      .container {
        position: relative;
        width: 90%;
        max-width: 900px;
        margin: 40px auto;
        background: rgba(219, 212, 212, 0.04);
        border-radius: 20px;
        overflow: hidden;
        display: flex;
        flex-wrap: wrap;
        min-height: 600px;
        box-shadow: 0 0 20px #0005;
      }
      .item {
        flex: 1 1 300px;
        min-width: 280px;
        padding: 40px 30px;
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: transparent;
      }
      .item .logo {
        font-size: 2rem;
        margin-bottom: 20px;
      }
      .text-item h2 {
        font-size: 2.2rem;
        line-height: 1.1;
      }
      .text-item p {
        font-size: 1rem;
        margin: 20px 0;
      }
      .social-icon a i {
        color: #fff;
        font-size: 1.5rem;
        margin-left: 10px;
        cursor: pointer;
        transition: 0.5s;
      }
      .social-icon a:hover i {
        transform: scale(1.2);
      }
      .login-section {
        flex: 1 1 320px;
        min-width: 280px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
      }
      .form-box {
        width: 100%;
        max-width: 350px;
        background: rgba(237, 232, 232, 0.05);
        border-radius: 12px;
        padding: 30px 20px;
        margin: 0 auto;
      }
      .form-box h2 {
        text-align: center;
        font-size: 1.5rem;
        margin-bottom: 20px;
      }
      .input-box {
        width: 100%;
        height: 50px;
        border-bottom: 2px solid #fff;
        margin: 25px 0;
        position: relative;
      }
      .input-box input {
        width: 100%;
        height: 100%;
        background: transparent;
        border: none;
        outline: none;
        font-size: 1rem;
        color: #fff;
        padding-right: 28px;
      }
      .input-box label {
        position: absolute;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
        font-size: 1rem;
        color: #fff;
        pointer-events: none;
        transition: 0.3s;
      }
      .input-box input:focus ~ label,
      .input-box input:valid ~ label {
        top: -10px;
        font-size: 0.85rem;
        color: #f72d7a;
      }
      .input-box .icon {
        position: absolute;
        top: 13px;
        right: 0;
        font-size: 1.2rem;
      }
      .remember-password {
        font-size: 0.95rem;
        margin: -10px 0 15px;
        display: flex;
        justify-content: space-between;
        color: #fff;
      }
      .remember-password label input {
        accent-color: #fff;
        margin-right: 3px;
      }
      .remember-password a {
        color: #fff;
        text-decoration: none;
      }
      .remember-password a:hover {
        text-decoration: underline;
      }
      .btn {
        background: #f72d7a;
        width: 100%;
        height: 45px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1rem;
        color: #fff;
        margin-top: 10px;
        transition: background 0.3s;
      }
      .btn:hover {
        background: #d11a5b;
      }
      .create-account {
        font-size: 1rem;
        text-align: center;
        margin: 20px 0 0 0;
      }
      .create-account p a {
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      .create-account p a:hover {
        text-decoration: underline;
      }
      /* Responsive Styles */
      @media (max-width: 900px) {
        .container {
          flex-direction: column;
          min-height: unset;
        }
        .item,
        .login-section {
          min-width: 100%;
          padding: 30px 10px;
        }
        .form-box {
          max-width: 100%;
        }
      }
      @media (max-width: 600px) {
        .background {
          background: url(images/backgroun3.jpg) no-repeat center center/cover;
          filter: blur(0px);
        }
        .form-box {
          background: rgba(237, 232, 232, 0);
        }
        .container {
          width: 75%;
          margin: 10px auto;
          border-radius: 10px;
          backdrop-filter: blur(10px);
        }
        .item,
        .login-section {
          padding: 20px 5px;
        }
        .form-box {
          padding: 15px 5px;
        }
        .text-item h2 {
          font-size: 1.3rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="background"></div>
    <div class="container">
      <div class="item">
        <h2 class="logo">Pill Grim</h2>
        <div class="text-item">
          <h2>Welcome! <br /><span>To Our Website</span></h2>
          <p>
            Your journey, your purpose. We can give you the best travel
            services, best hospitality. Register for your own.
          </p>
          <div class="social-icon">
            <a href="#"><i class="bx bxl-facebook"></i></a>
            <a href="#"><i class="bx bxl-twitter"></i></a>
            <a href="#"><i class="bx bxl-youtube"></i></a>
            <a href="#"><i class="bx bxl-instagram"></i></a>
            <a href="#"><i class="bx bxl-linkedin"></i></a>
          </div>
        </div>
      </div>
      <div class="login-section">
        <div class="form-box login">
          <form action="" method="POST">
            <h2>Sign In</h2>
            <div class="input-box">
              <span class="icon"><i class="bx bxs-envelope"></i></span>
              <input type="email" name="email" required />
              <label>Email</label>
            </div>
            <div class="input-box">
              <span class="icon"><i class="bx bxs-lock-alt"></i></span>
              <input type="password" name="password" required />
              <label>Password</label>
            </div>
            <div class="remember-password">
              <label><input type="checkbox" />Remember Me</label>
              <a href="#">Forget Password</a>
            </div>
            <button class="btn" id="go_to_homepage">Sign in</button>
            <div class="create-account">
              <p>
                Create A New Account?
                <a href="#" class="register-link">Sign Up</a>
              </p>
            </div>
          </form>
        </div>
        <div class="form-box register" style="display: none">
          <form action="" method="POST">
            <h2>Sign Up</h2>
            <div class="input-box">
              <span class="icon"><i class="bx bxs-user"></i></span>
              <input type="text" name="name" required />
              <label>Username</label>
            </div>
            <div class="input-box">
              <span class="icon"><i class="bx bxs-envelope"></i></span>
              <input type="email" name="email" required />
              <label>Email</label>
            </div>
            <div class="input-box">
              <span class="icon"><i class="bx bxs-lock-alt"></i></span>
              <input type="password" name="password" required />
              <label>Password</label>
            </div>
            <div class="remember-password">
              <label
                ><input type="checkbox" />I agree with this statement</label
              >
            </div>
            <button name="signUp" class="btn" id="loginnn">Sign up</button>
            <div class="create-account">
              <p>
                Already Have An Account?
                <a href="#" class="login-link">Sign In</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script>
      // Toggle between login and register forms
      const loginSection = document.querySelector(".login-section");
      const loginFormBox = document.querySelector(".form-box.login");
      const registerFormBox = document.querySelector(".form-box.register");
      const signupLink = document.querySelector(".register-link");
      const loginLink = document.querySelector(".login-link");

      signupLink.addEventListener("click", (e) => {
        e.preventDefault();
        loginFormBox.style.display = "none";
        registerFormBox.style.display = "block";
      });
      loginLink.addEventListener("click", (e) => {
        e.preventDefault();
        registerFormBox.style.display = "none";
        loginFormBox.style.display = "block";
      });
      document
        .getElementById("go-to-homepage")
        .addEventListener("click", function () {
          window.location.href = "index.html";
        });
    </script>
  </body>
</html>
